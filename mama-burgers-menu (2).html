<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mama Burgers — Meni</title>
<meta name="description" content="Mama Burgers — Homemade Premium Quality Gourmet Burgers. Digitalni meni.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600;700&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0b0b0b;
    --charcoal:#181818;
    --charcoal-2:#212121;
    --line:#2c2a24;
    --yellow:#f4c531;
    --yellow-deep:#d9a70e;
    --yellow-soft:#fbe08a;
    --cream:#f7f2e6;
    --muted:#a9a397;
    --muted-2:#7a7568;
    --radius:14px;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--black);
    color:var(--cream);
    font-family:'Poppins',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:'Anton',sans-serif; letter-spacing:.5px; text-transform:uppercase;}
  .script{font-family:'Caveat',cursive;}
  img,svg{display:block;}
  a{color:inherit;}
  ::selection{background:var(--yellow); color:#000;}

  /* ---------- scrollbar ---------- */
  ::-webkit-scrollbar{height:6px; width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--yellow-deep); border-radius:10px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:60;
    background:rgba(11,11,11,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{
    max-width:1180px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 18px;
    gap:12px;
  }
  .brand{display:flex; align-items:center; gap:10px; cursor:pointer; user-select:none;}
  .brand-badge{
    width:40px; height:40px;
    object-fit:contain;
    flex:none;
  }
  .brand-text{line-height:1;}
  .brand-text .l1{font-family:'Anton',sans-serif; font-size:15px; letter-spacing:1px;}
  .brand-text .l2{font-family:'Caveat',cursive; font-size:19px; color:var(--yellow); font-weight:700; margin-top:1px;}

  .topbar-actions{display:flex; align-items:center; gap:10px;}

  .lang-switch{
    display:flex; background:var(--charcoal); border:1px solid var(--line);
    border-radius:999px; padding:3px; gap:2px;
  }
  .lang-btn{
    border:none; background:transparent; color:var(--muted);
    font-family:'Poppins',sans-serif; font-weight:600; font-size:12.5px;
    padding:7px 11px; border-radius:999px; cursor:pointer;
    transition:.25s ease;
  }
  .lang-btn.active{background:var(--yellow); color:#000;}
  .lang-btn:not(.active):hover{color:var(--cream);}

  .search-toggle{
    width:38px; height:38px; border-radius:50%;
    border:1px solid var(--line); background:var(--charcoal);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--cream); flex:none;
    transition:.25s ease;
  }
  .search-toggle:hover{border-color:var(--yellow);}
  .search-toggle svg{width:17px; height:17px;}

  .search-bar{
    max-width:1180px; margin:0 auto;
    padding:0 18px; overflow:hidden;
    max-height:0; transition:max-height .35s ease, padding .35s ease;
  }
  .search-bar.open{max-height:70px; padding:0 18px 12px;}
  .search-field{
    display:flex; align-items:center; gap:10px;
    background:var(--charcoal); border:1px solid var(--line);
    border-radius:999px; padding:10px 16px;
  }
  .search-field svg{width:17px; height:17px; color:var(--muted-2); flex:none;}
  .search-field input{
    border:none; background:transparent; outline:none;
    color:var(--cream); font-family:'Poppins',sans-serif; font-size:14.5px;
    width:100%;
  }
  .search-field input::placeholder{color:var(--muted-2);}
  .search-clear{
    background:none; border:none; color:var(--muted-2); cursor:pointer;
    display:none; padding:2px;
  }
  .search-clear svg{width:15px; height:15px;}

  /* ---------- category nav ---------- */
  .cat-nav{
    position:sticky; top:62px; z-index:55;
    background:rgba(11,11,11,.96);
    border-bottom:1px solid var(--line);
  }
  .cat-nav-scroll{
    max-width:1180px; margin:0 auto;
    display:flex; gap:8px; overflow-x:auto;
    padding:11px 18px; scrollbar-width:none;
  }
  .cat-nav-scroll::-webkit-scrollbar{display:none;}
  .cat-pill{
    flex:none; display:flex; align-items:center; gap:7px;
    padding:8px 14px; border-radius:999px;
    background:var(--charcoal); border:1px solid var(--line);
    color:var(--muted); font-size:13px; font-weight:600;
    cursor:pointer; white-space:nowrap; transition:.2s ease;
  }
  .cat-pill svg{width:15px; height:15px; opacity:.85;}
  .cat-pill.active{background:var(--yellow); color:#000; border-color:var(--yellow);}
  .cat-pill:not(.active):hover{border-color:var(--yellow-deep); color:var(--cream);}

  /* ---------- hero ---------- */
  .hero{
    position:relative;
    padding:56px 18px 40px;
    text-align:center;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(244,197,49,.10), transparent 60%),
      var(--black);
    border-bottom:1px solid var(--line);
    overflow:hidden;
  }
  .hero::before, .hero::after{
    content:""; position:absolute; left:0; right:0; height:1px;
    background:repeating-linear-gradient(90deg, var(--line) 0 10px, transparent 10px 20px);
  }
  .hero-logo{
    width:min(58vw, 230px); height:auto; margin:0 auto; display:block;
    filter:drop-shadow(0 8px 24px rgba(244,197,49,.12));
  }
  .hero .sub{
    margin:14px auto 0; max-width:480px; color:var(--muted);
    font-size:14.5px; letter-spacing:.4px;
  }
  .hero .tags{
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:20px;
  }
  .hero .tag{
    border:1px solid var(--line); border-radius:999px; padding:6px 14px;
    font-size:11.5px; letter-spacing:1px; color:var(--yellow-soft); text-transform:uppercase;
    font-weight:600;
  }

  /* ---------- content ---------- */
  .content{max-width:1180px; margin:0 auto; padding:10px 18px 60px;}

  .category-section{padding-top:38px; scroll-margin-top:130px;}
  .cat-header{
    display:flex; align-items:center; gap:12px;
    margin-bottom:6px;
  }
  .cat-header .icon-wrap{
    width:42px; height:42px; border-radius:50%;
    background:var(--yellow); color:#000;
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .cat-header .icon-wrap svg{width:22px; height:22px;}
  .cat-header h2{font-size:clamp(22px,5vw,30px); margin:0; color:var(--cream);}
  .cat-desc{color:var(--muted); font-size:13.5px; margin:2px 0 22px 54px; max-width:640px;}

  .promo-note{
    display:flex; gap:12px; align-items:center;
    background:linear-gradient(120deg, var(--charcoal), var(--charcoal-2));
    border:1px dashed var(--yellow-deep); border-radius:var(--radius);
    padding:14px 16px; margin:0 0 22px; color:var(--yellow-soft); font-size:13px; line-height:1.5;
  }
  .promo-note svg{width:26px; height:26px; color:var(--yellow); flex:none;}

  .subgroup-title{
    font-family:'Anton',sans-serif; letter-spacing:1px; text-transform:uppercase;
    color:var(--yellow); font-size:16px; margin:26px 0 12px;
    padding-bottom:8px; border-bottom:1px solid var(--line);
  }
  .subgroup-title:first-of-type{margin-top:0;}

  .items-grid{
    display:grid; grid-template-columns:repeat(2, 1fr); gap:12px;
  }
  .items-grid.list{grid-template-columns:1fr;}

  .item-card{
    background:var(--charcoal); border:1px solid var(--line);
    border-radius:var(--radius); padding:16px;
    display:flex; flex-direction:column; gap:8px;
    transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    opacity:0; transform:translateY(14px);
    animation:rise .5s ease forwards;
  }
  @keyframes rise{to{opacity:1; transform:translateY(0);}}
  .item-card:hover{border-color:var(--yellow-deep); transform:translateY(-3px); box-shadow:var(--shadow);}

  .item-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .item-name{font-weight:700; font-size:15px; color:var(--cream); line-height:1.3;}
  .item-name .plus{color:var(--yellow);}
  .item-price{
    font-family:'Anton',sans-serif; color:var(--yellow); font-size:16px;
    white-space:nowrap; flex:none;
  }
  .item-price small{font-size:10px; opacity:.8; margin-left:2px;}
  .item-desc{color:var(--muted); font-size:12.8px; line-height:1.55;}
  .item-meta{
    display:flex; gap:8px; margin-top:auto; padding-top:6px;
  }
  .item-meta span{
    font-size:10.5px; color:var(--muted-2); border:1px solid var(--line);
    border-radius:6px; padding:3px 7px; letter-spacing:.4px;
  }
  .drink-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 4px; border-bottom:1px solid var(--line);
    opacity:0; transform:translateY(10px); animation:rise .45s ease forwards;
  }
  .drink-row:last-child{border-bottom:none;}
  .drink-name{font-weight:600; font-size:14px; color:var(--cream);}
  .drink-price{display:flex; align-items:baseline; gap:10px; flex:none;}
  .drink-vol{color:var(--muted-2); font-size:12px;}
  .drink-amount{font-family:'Anton',sans-serif; color:var(--yellow); font-size:15px;}

  .no-results{
    text-align:center; padding:60px 20px; color:var(--muted); display:none;
  }
  .no-results.show{display:block;}
  .no-results svg{width:46px; height:46px; margin:0 auto 14px; color:var(--muted-2);}
  .no-results h3{color:var(--cream); margin:0 0 6px; font-size:18px;}

  /* ---------- back to top ---------- */
  .top-btn{
    position:fixed; right:18px; bottom:18px; z-index:70;
    width:46px; height:46px; border-radius:50%;
    background:var(--yellow); color:#000; border:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:var(--shadow);
    opacity:0; pointer-events:none; transform:translateY(10px) scale(.9);
    transition:.3s ease;
  }
  .top-btn.show{opacity:1; pointer-events:auto; transform:translateY(0) scale(1);}
  .top-btn svg{width:20px; height:20px;}

  /* ---------- footer ---------- */
  footer{
    border-top:1px solid var(--line); padding:34px 18px 90px;
    text-align:center; color:var(--muted-2); font-size:12px;
  }
  footer .fbrand{font-family:'Anton',sans-serif; color:var(--yellow); font-size:16px; margin-bottom:6px; letter-spacing:1px;}
  footer .fscript{font-family:'Caveat',cursive; color:var(--cream); font-size:15px;}

  /* ---------- responsive ---------- */
  @media (min-width:640px){
    .items-grid{grid-template-columns:repeat(2,1fr);}
  }
  @media (min-width:860px){
    .items-grid{grid-template-columns:repeat(3,1fr);}
    .brand-text .l1{font-size:16px;}
  }
  @media (max-width:480px){
    .items-grid{grid-template-columns:1fr;}
    .cat-desc{margin-left:0;}
    .cat-header{gap:10px;}
  }

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    .item-card, .drink-row{animation:none; opacity:1; transform:none;}
    *{transition:none !important;}
  }

  :focus-visible{outline:2px solid var(--yellow); outline-offset:2px;}
</style>
</head>

/* ================= STATE ================= */
let currentLang = "bs";
let searchQuery = "";

const contentEl = document.getElementById("content");
const catNavEl = document.getElementById("catNav");
const noResultsEl = document.getElementById("noResults");

/* ================= RENDER ================= */
function render(){
  const d = DATA[currentLang];
  document.documentElement.lang = currentLang;
  document.getElementById("heroSub").textContent = d.heroSub;
  document.getElementById("searchInput").placeholder = d.searchPlaceholder;
  document.getElementById("noResTitle").textContent = d.noResTitle;
  document.getElementById("noResSub").textContent = d.noResSub;

  // tags
  const tagsEl = document.getElementById("heroTags");
  tagsEl.innerHTML = d.tags.map(t=>`<span class="tag">${t}</span>`).join("");

  // nav
  catNavEl.innerHTML = d.categories.map((c,i)=>`
    <button class="cat-pill ${i===0?'active':''}" data-target="cat-${c.id}">
      ${ICONS[c.icon]}<span>${c.name}</span>
    </button>`).join("");

  // sections
  const q = searchQuery.trim().toLowerCase();
  let totalMatches = 0;

  contentEl.innerHTML = d.categories.map(c=>{
    let bodyHTML = "";
    let matches = 0;

    if(c.items){
      const filtered = c.items.filter(it => !q || (it.name.toLowerCase().includes(q) || it.desc.toLowerCase().includes(q)));
      matches = filtered.length;
      bodyHTML = `<div class="items-grid">${filtered.map((it,idx)=>`
        <div class="item-card" style="animation-delay:${Math.min(idx*40,320)}ms">
          <div class="item-top">
            <div class="item-name">${it.name}</div>
            <div class="item-price">${it.price}<small>KM</small></div>
          </div>
          ${it.desc ? `<div class="item-desc">${it.desc}</div>` : ""}
          ${it.weight ? `<div class="item-meta"><span>${it.weight}</span></div>` : ""}
        </div>`).join("")}</div>`;
    } else if(c.drinks){
      bodyHTML = c.drinks.map(group=>{
        const filtered = group.items.filter(it => !q || it.name.toLowerCase().includes(q));
        matches += filtered.length;
        if(filtered.length===0) return "";
        return `<div class="subgroup-title">${group.group}</div>
          <div class="items-grid list">${filtered.map((it,idx)=>`
            <div class="drink-row" style="animation-delay:${Math.min(idx*30,300)}ms">
              <div class="drink-name">${it.name}</div>
              <div class="drink-price"><span class="drink-vol">${it.vol}</span><span class="drink-amount">${it.price}<small style="font-size:9px;">KM</small></span></div>
            </div>`).join("")}</div>`;
      }).join("");
    }

    totalMatches += matches;
    if(matches===0) return "";

    return `
      <section class="category-section" id="cat-${c.id}">
        <div class="cat-header">
          <div class="icon-wrap">${ICONS[c.icon]}</div>
          <h2>${c.name}</h2>
        </div>
        ${c.note ? `<div class="promo-note">${ICONS.combo}<span>${c.note}</span></div>` : ""}
        ${bodyHTML}
      </section>`;
  }).join("");

  noResultsEl.classList.toggle("show", totalMatches===0);
  bindNav();
}

/* ================= NAV BINDING ================= */
function bindNav(){
  document.querySelectorAll(".cat-pill").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const target = document.getElementById(btn.dataset.target);
      if(target){
        const offset = target.getBoundingClientRect().top + window.scrollY - 120;
        window.scrollTo({top:offset, behavior:"smooth"});
      }
    });
  });
}

/* ================= LANGUAGE SWITCH ================= */
document.querySelectorAll(".lang-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".lang-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentLang = btn.dataset.lang;
    render();
  });
});

/* ================= SEARCH ================= */
const searchToggle = document.getElementById("searchToggle");
const searchBar = document.getElementById("searchBar");
const searchInput = document.getElementById("searchInput");
const searchClear = document.getElementById("searchClear");

searchToggle.addEventListener("click", ()=>{
  searchBar.classList.toggle("open");
  if(searchBar.classList.contains("open")) setTimeout(()=>searchInput.focus(),200);
});

searchInput.addEventListener("input", (e)=>{
  searchQuery = e.target.value;
  searchClear.style.display = searchQuery ? "block" : "none";
  render();
});

searchClear.addEventListener("click", ()=>{
  searchQuery = "";
  searchInput.value = "";
  searchClear.style.display = "none";
  render();
});

/* ================= SCROLL SPY + BACK TO TOP ================= */
const topBtn = document.getElementById("topBtn");
window.addEventListener("scroll", ()=>{
  topBtn.classList.toggle("show", window.scrollY > 500);

  const sections = document.querySelectorAll(".category-section");
  let activeId = null;
  sections.forEach(sec=>{
    const rect = sec.getBoundingClientRect();
    if(rect.top <= 140 && rect.bottom > 140) activeId = sec.id;
  });
  if(activeId){
    document.querySelectorAll(".cat-pill").forEach(p=>{
      p.classList.toggle("active", p.dataset.target === activeId);
    });
  }
}, {passive:true});

topBtn.addEventListener("click", ()=>window.scrollTo({top:0, behavior:"smooth"}));
document.getElementById("brandHome").addEventListener("click", ()=>window.scrollTo({top:0, behavior:"smooth"}));

/* ================= INIT ================= */
render();
</script>
</body>
